name: iOS CI Enhanced

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
    
    - name: Cache Swift Package Manager
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Build
      run: swift build -v
    
    - name: Run Tests with Coverage
      run: swift test --enable-code-coverage
    
    - name: Generate Coverage Report
      run: |
        xcrun llvm-cov export -format="lcov" \
          .build/debug/TraceWiseSDKPackageTests.xctest/Contents/MacOS/TraceWiseSDKPackageTests \
          -instr-profile .build/debug/codecov/default.profdata > coverage.lcov
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.lcov
        flags: ios
        name: ios-coverage
    
    - name: SwiftLint
      run: |
        if which swiftlint >/dev/null; then
          swiftlint --strict
        else
          echo "SwiftLint not installed, skipping..."
        fi
    
    - name: Build Documentation
      run: |
        swift package generate-documentation --target TraceWiseSDK
    
    - name: Archive Build Products
      run: |
        swift build -c release
        tar -czf TraceWiseSDK-build.tar.gz .build/release/

  integration-test:
    runs-on: macos-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
    
    - name: Run Integration Tests
      run: swift test --filter IntegrationTests
    
    - name: Performance Tests
      run: swift test --filter PerformanceTests

  quality-check:
    runs-on: macos-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Code Quality
      run: |
        # Check for TODO/FIXME comments
        if grep -r "TODO\|FIXME" Sources/; then
          echo "Found TODO/FIXME comments"
          exit 1
        fi
        
        # Check for force unwrapping
        if grep -r "!" Sources/ --include="*.swift" | grep -v "// swiftlint:disable"; then
          echo "Found force unwrapping - consider safer alternatives"
          exit 1
        fi