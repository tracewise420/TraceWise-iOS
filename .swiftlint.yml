disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - array_init
  - closure_spacing
  - empty_count
  - explicit_init
  - force_unwrapping
  - implicit_return
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

included:
  - Sources
  - Tests

excluded:
  - .build
  - Package.swift

line_length:
  warning: 120
  error: 150

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 100

custom_rules:
  no_print:
    name: "No Print Statements"
    regex: "print\\("
    message: "Use proper logging instead of print statements"
    severity: warning
    
  force_unwrapping:
    name: "Force Unwrapping"
    regex: "\\w+!"
    message: "Avoid force unwrapping - use safe unwrapping instead"
    severity: error